<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<style>
:root {
  --bg: #161514; --panel: #1f1e1c; --panel-2: #262422; --line: #34322f; --text: #ece9e4; --muted: #9a958d; --faint: #6d6862;
  --blue: #5b8def; --orange: #e7a33e; --green: #4fbf7f; --red: #e5604f; --purple: #a98bea; --teal: #3fb6b0; --gray: #8b8780;
  --hl: rgba(231, 199, 62, .16); --hl-line: #e7c73e; --code-text: #e9dcc0;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", "Pretendard", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.wrap { padding: 12px 14px 24px; max-width: 1800px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header { margin-bottom: 10px; }
.spacer { flex: 1; }
.where { color: var(--faint); font-size: 12.5px; flex: 1 1 120px; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
.tab { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; color: var(--muted); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.tab b { color: var(--text); margin-right: 6px; }
.tab small { opacity: .6; font-size: 12px; margin-left: 4px; }
.tab.on { background: var(--text); color: #1a1918; border-color: var(--text); }
.tab.on b { color: #1a1918; }
.tab.err { border-color: var(--red); }
.ctrl { display: flex; align-items: center; gap: 6px; flex: none; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
label.btn { display: inline-flex; gap: 6px; align-items: center; }
.count { color: var(--muted); min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.progress { height: 3px; background: var(--line); border-radius: 2px; margin: 10px 0 14px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--blue); transition: width .3s; }
.modes { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.mode { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; color: var(--muted); }
.mode.on { background: var(--panel-2); color: var(--text); }
.mode .n { background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; border: 1px solid var(--line); color: var(--muted); }
.pill.busy { color: var(--orange); border-color: rgba(231,163,62,.5); }
.pill.gen { color: var(--blue); border-color: rgba(91,141,239,.5); }
.pill.err { color: var(--red); border-color: rgba(229,96,79,.5); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.busy .dot, .gen .dot { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
@media (max-width: 1700px) { .grid { grid-template-columns: 300px minmax(0, 1fr); } .grid > :first-child { grid-row: 1 / span 2; } .side { grid-column: 2; } }
@media (max-width: 1250px) { .grid { grid-template-columns: 260px minmax(0, 1fr); } }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } .tab { max-width: 180px; } .grid > .detail { order: -1; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card h3 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.side .card + .card { margin-top: 14px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { position: relative; }
.steps li + li::before { content: ""; position: absolute; left: 24px; top: -8px; height: 12px; border-left: 1px dashed var(--line); }
.step { display: flex; gap: 12px; width: 100%; text-align: left; padding: 8px; border-radius: 10px; border: 1px solid transparent; background: transparent; }
.step:hover { background: var(--panel-2); }
.step.on { background: var(--panel-2); border-color: var(--line); }
.num { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--c); color: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.step.changed .num { background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: 0 0 0 3px rgba(231,199,62,.25); }
.step .t { display: block; font-weight: 600; line-height: 1.35; }
.step .l { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.chg { font-size: 11px; color: var(--hl-line); margin-left: 6px; font-weight: 600; }
.note { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; color: var(--muted); font-size: 12.5px; }

.ctx { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
.h h2 { margin: 0; font-size: 22px; }
.badge { font-size: 12px; border-radius: 6px; padding: 2px 8px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); font-weight: 600; }
.loc { display: inline-block; background: var(--panel-2); border-radius: 6px; padding: 2px 8px; margin-bottom: 12px; overflow-wrap: anywhere; }
.explain { margin: 0 0 18px; padding: 0; list-style: none; max-width: 72ch; }
.explain li { font-size: 15px; line-height: 1.7; padding: 3px 0 3px 16px; position: relative; overflow-wrap: anywhere; }
.explain li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.explain li.sub { padding-left: 32px; color: var(--muted); }
.explain li.sub::before { left: 18px; background: transparent; border: 1px solid var(--faint); }
strong { color: #fff; font-weight: 700; }
em { color: #d9cfe9; }
mark { background: rgba(231,199,62,.22); color: #f3e3a3; border-radius: 4px; padding: 0 3px; }
.explain code, .note code, .row .v code, .qa code { background: var(--panel-2); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; color: var(--code-text); }
.label { color: var(--muted); font-size: 12.5px; margin: 14px 0 6px; }
pre.code { margin: 0; background: #141312; border: 1px solid var(--line); border-radius: 10px; padding: 12px 0; font: 12.5px/1.6 var(--mono); }
pre.code span { display: block; padding: 1px 14px 1px 2.2em; text-indent: -1.2em; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.code span.hl { background: var(--hl); box-shadow: inset 3px 0 var(--hl-line); }
.before { text-decoration: line-through; color: var(--faint); margin-right: 8px; }
.example { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.example b { color: var(--text); margin-right: 6px; }
.state { padding: 0; overflow: hidden; }
.state h3 { padding: 16px 16px 0; }
.state table { width: 100%; border-collapse: collapse; font-size: 13px; }
.state td { border-top: 1px solid var(--line); padding: 8px 16px; vertical-align: top; overflow-wrap: anywhere; }
.state td:first-child { color: var(--muted); width: 1%; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
@media (max-width: 1250px) { .state td:first-child { white-space: normal; width: 40%; } }
.state td:last-child { font-family: var(--mono); font-size: 12.5px; }
.state tr.now { background: rgba(231,199,62,.13); }
.state tr.now td:first-child { color: var(--hl-line); }
.state tr.now td:last-child::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--hl-line); margin-left: 8px; vertical-align: middle; }
.state .step-no { color: var(--faint); font-size: 11px; margin-left: 6px; font-family: inherit; }

.rows { display: flex; flex-direction: column; }
.row { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.row:first-child { border-top: 0; }
.row .k { flex: none; font-family: var(--mono); font-size: 12px; }
.row .v { min-width: 0; color: var(--muted); overflow-wrap: anywhere; }
.row .path { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; flex: 1; }
.request { white-space: pre-wrap; color: var(--muted); font-size: 13px; }
.meta { color: var(--faint); font-size: 12px; margin-top: 8px; }
.st-ok, .st-pass { color: var(--green); } .st-err, .st-fail { color: var(--red); } .st-run { color: var(--orange); } .st-lost, .st-unknown { color: var(--faint); }
.A { color: var(--green); } .M { color: var(--orange); }
.tool { display: grid; grid-template-columns: 14px 62px minmax(60px, 120px) minmax(0, 1fr) auto; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; align-items: baseline; }
.tool:first-child { border-top: 0; }
.tool .time, .tool .dur { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
.tool .name { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .sum { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name.edit { color: var(--purple); } .name.mcp { color: var(--teal); } .name.other { color: var(--blue); }
.empty { color: var(--faint); padding: 18px 0; text-align: center; }
.big-empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.big-empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.err-box { border: 1px solid rgba(229,96,79,.5); background: rgba(229,96,79,.08); border-radius: 10px; padding: 12px; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .live-grid { grid-template-columns: minmax(0, 1fr); } }

.qa-bar { margin-bottom: 12px; }
.qa-turn { margin-bottom: 20px; }
.qa-wait { border-color: var(--orange); }
.qa-wait ul { margin: 8px 0 0; padding-left: 20px; }
.qa-wait li { max-width: 72ch; margin: 4px 0; overflow-wrap: anywhere; }
.qa-wait li small { color: var(--faint); margin-left: 6px; }
.qa-note { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.qa-eta { color: var(--faint); font-size: 12.5px; margin: 0 2px 12px; }
.qa-head { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: 12.5px; margin-bottom: 8px; flex-wrap: wrap; }
.qa-head .p { max-width: 72ch; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 200px; }
.qa-item { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
.qa-item:first-of-type { border-top: 0; }
.qa-item.archived { opacity: .45; }
.qa-item .q { font-weight: 700; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; max-width: 72ch; }
.qa-item .q small { font-weight: 400; color: var(--faint); margin-left: 6px; font-size: 11.5px; }
.qa-item .a { color: var(--muted); font-size: 14px; line-height: 1.7; margin-top: 8px; overflow-wrap: anywhere; max-width: 72ch; }
.qa-item .a p { margin: 0 0 4px; }
.qa-item .resolved { color: var(--green); font-size: 12.5px; margin-top: 4px; }
.qid { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 8px; font-weight: 400; user-select: all; opacity: 0; transition: opacity .15s; }
.qa-item:hover .qid, .qid:focus { opacity: 1; }
.qa-tools { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
.mini:hover { color: var(--text); border-color: var(--faint); }
.tip { position: fixed; z-index: 60; max-width: min(520px, calc(100vw - 16px)); padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.tip:empty { display: none; }
.chip { font-size: 12px; border: 0; border-radius: 999px; padding: 2px 8px; text-align: center; align-self: start; font-weight: 600; white-space: nowrap; }
.chip.answered { color: var(--green); background: rgba(79,191,127,.12); }
.chip.partial { color: var(--orange); background: rgba(231,163,62,.14); }
.chip.unanswered { color: var(--red); background: rgba(229,96,79,.14); }
[aria-disabled="true"] { opacity: .5; cursor: default; }
.pager { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 6px 0 14px; flex-wrap: wrap; }
.pager button { min-width: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 9px; font-size: 13px; color: var(--muted); }
.pager button.on { background: var(--text); color: #1a1918; border-color: var(--text); font-weight: 700; }
.pager button:disabled { opacity: .35; cursor: default; }
.pager span { color: var(--faint); font-size: 12.5px; margin: 0 6px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { max-width: 760px; width: 100%; max-height: 90vh; overflow: auto; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dialog-head h3 { margin: 0; }
.dialog h4 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); }
.dialog p { color: var(--muted); font-size: 13px; }
.dialog table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dialog td { border-top: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.dialog td.cmd { font-family: var(--mono); font-size: 12px; color: var(--code-text); overflow-wrap: anywhere; width: 45%; }
.dialog .scoped { color: var(--blue); font-size: 12px; margin-left: 8px; }
.dialog .msg-ok { color: var(--green); } .dialog .msg-err { color: var(--red); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-family: var(--mono); font-size: 12px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.keys a { color: inherit; text-decoration: none; }
.keys .card:hover { border-color: var(--faint); }
.keys .path { color: var(--faint); margin: 4px 0 8px; overflow-wrap: anywhere; }
.keys .counts { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
.toast.err { border-color: rgba(229,96,79,.6); color: #f2b3aa; }
.toast:empty { display: none; }
.space-between { display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip"></div>
<script>
const KEY = __PANEL_KEY__;
const I18N = __PANEL_I18N__;
const TOKEN = __PANEL_TOKEN__;
const LANG = I18N.lang;
const PARAMS = new URLSearchParams(location.search);
const FULL = PARAMS.has("full");

const MODES = ["flow", "live", "qa"];
const QA = { ANSWERED: "answered", PARTIAL: "partial", UNANSWERED: "unanswered" };
const QA_CYCLE = { [QA.ANSWERED]: QA.PARTIAL, [QA.PARTIAL]: QA.UNANSWERED, [QA.UNANSWERED]: QA.ANSWERED };
const TOOL = { RUN: "run", OK: "ok", ERR: "err", LOST: "lost" };
const REC = { OK: "ok", ERROR: "error" };
const CHECK = { PASS: "pass", FAIL: "fail", UNKNOWN: "unknown" };
const CHECK_ICON = { [CHECK.PASS]: "✓", [CHECK.FAIL]: "✗", [CHECK.UNKNOWN]: "?" };
const TOOL_ICON = { [TOOL.OK]: "✓", [TOOL.ERR]: "✗", [TOOL.RUN]: "◌" };
const SCOPE_THROUGH_END = "through-end";
const FROM_MID_TURN = "mid-turn";
const DIALOG = { HELP: "help", SETTINGS: "settings" };
const KEY_MODES = { 1: "flow", 2: "live", 3: "qa" };
const SCOPE = { GLOBAL: "global", PANE: "pane" };
const EDIT_TOOLS = new Set(["Edit", "Write", "MultiEdit", "NotebookEdit"]);
const QA_PAGE = 10;
const POLL_MS = 1000;
const AUTOPLAY_MS = 3500;
const TOAST_MS = 4000;
const FETCH_TIMEOUT_MS = 8000;
const RECENT_TOUCH_MS = 30000;
const MIN_HIGHLIGHT = 3;
const TOOLS_IN_FLOW = 12;
const TOOLS_IN_LIVE = 200;
const KINDS = {
  input: "var(--gray)", logic: "var(--blue)", external: "var(--orange)", storage: "var(--green)",
  output: "var(--purple)", config: "var(--gray)", test: "var(--teal)",
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const text = (k, ...a) => String(I18N.messages[k] || I18N.fallback[k] || k).replace(/\{(\d)\}/g, (_, i) => String(a[i] ?? ""));
const t = (k, ...a) => esc(text(k, ...a));
const kindColor = k => KINDS[k] || KINDS.logic;
const kindLabel = k => t(`kind_${KINDS[k] ? k : "logic"}`);
const secs = s => s < 1 ? `${Math.round(s * 1000)}ms` : s < 60 ? `${s.toFixed(1)}s` : `${Math.floor(s / 60)}m${String(Math.floor(s % 60)).padStart(2, "0")}s`;
const clock = ts => ts ? new Date(ts * 1000).toTimeString().slice(0, 8) : "";
const hhmm = ts => clock(ts).slice(0, 5);
const circled = n => n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`;
const list = v => Array.isArray(v) ? v : [];
const STATUS_LABEL = { [QA.ANSWERED]: text("st_answered"), [QA.PARTIAL]: text("st_partial"), [QA.UNANSWERED]: text("st_unanswered") };
const statusLabel = status => STATUS_LABEL[status] || "-";

const S = {
  mode: MODES.includes(PARAMS.get("mode")) ? PARAMS.get("mode") : null,
  step: Math.max(0, parseInt(PARAMS.get("step"), 10) || 0),
  dialog: Object.values(DIALOG).includes(PARAMS.get("dialog")) ? PARAMS.get("dialog") : null,
  lastTouch: PARAMS.get("mode") ? Date.now() : 0,
  state: null, flows: [], pending: null, qa: { turns: [], pending: false }, flowCache: {}, flowId: null,
  seenFlows: null, playing: null, error: null, sig: null, panes: null,
  qaPage: 1, qaOnlyOpen: false, qaArchived: false, qaPageTurns: [], busyIds: new Set(), scrolledFlowId: null,
  config: null, scope: PARAMS.get("scope") === SCOPE.PANE ? SCOPE.PANE : SCOPE.GLOBAL, settingsMsg: null, returnFocus: null,
  polling: null,
};
const touch = () => { S.lastTouch = Date.now(); };
const recentlyTouched = () => Date.now() - S.lastTouch < RECENT_TOUCH_MS;
document.documentElement.lang = LANG;
document.title = text("title_index");

async function api(method, url, body) {
  try {
    const r = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json", "X-Side-Insights": TOKEN },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),
    });
    const data = await r.json().catch(() => ({}));
    return r.ok ? { ok: true, data } : { ok: false, error: data.error || r.statusText, status: r.status };
  } catch (e) {
    return { ok: false, error: text("err_server") };
  }
}

function inline(source) {
  const md = /(`[^`]+`)|\*\*([^*\s](?:[^*]*?[^*\s])?)\*\*|(^|[\s(])==([^=\s](?:[^=]*?[^=\s])?)==(?=[\s).,!?:;]|$)|(^|[\s(])\*([^*\s](?:[^*]*?[^*\s])?)\*(?=[\s).,!?:]|$)/g;
  const raw = String(source ?? "");
  let out = "", last = 0, m;
  while ((m = md.exec(raw))) {
    out += esc(raw.slice(last, m.index));
    if (m[1]) out += `<code>${esc(m[1].slice(1, -1))}</code>`;
    else if (m[2]) out += `<strong>${inline(m[2])}</strong>`;
    else if (m[4]) out += `${esc(m[3])}<mark>${inline(m[4])}</mark>`;
    else out += `${esc(m[5])}<em>${esc(m[6])}</em>`;
    last = md.lastIndex;
  }
  return out + esc(raw.slice(last));
}

function sentences(source) {
  const raw = String(source ?? "").trim();
  if (raw.includes("\n")) return raw.split("\n").map(l => l.trim()).filter(Boolean);
  const spans = [];
  const masked = raw.replace(/`[^`]+`|\*\*[^*]+\*\*|==[^=]+==/g, c => `\u0001${spans.push(c) - 1}\u0001`);
  return masked.replace(/([.!?])\s+(?=\S)|([。！？])(?=\S)/g, (_, a, b) => `${a || b}\n`).split("\n")
    .map(l => l.replace(/\u0001(\d+)\u0001/g, (_, i) => spans[i]).trim()).filter(Boolean);
}

const prose = source => `<ul class="explain">${sentences(source).map(l => /^[-*] /.test(l)
  ? `<li class="sub">${inline(l.slice(2))}</li>` : `<li>${inline(l)}</li>`).join("")}</ul>`;

function poll(force) {
  if (S.polling) return force ? S.polling.then(() => poll(true)) : S.polling;
  S.polling = pollOnce(force).finally(() => { S.polling = null; });
  return S.polling;
}

async function pollOnce(force) {
  const r = await api("GET", KEY ? `/api/${KEY}/state` : "/api/panes");
  if (!r.ok) {
    const wasConnected = !S.error;
    S.error = r.error;
    S.sig = null;
    if (wasConnected) renderSoon();
    return;
  }
  S.error = null;
  if (!KEY) {
    S.panes = r.data;
  } else {
    absorbState(r.data);
    await loadFlow();
  }
  const sig = JSON.stringify([r.data, S.flowId, Object.keys(S.flowCache)]);
  const userIsReading = S.dialog || String(window.getSelection?.() || "").length > 0;
  if (!force && userIsReading) return tickTimers();
  if (force || sig !== S.sig) {
    S.sig = sig;
    render();
  } else {
    tickTimers();
  }
}

function renderSoon() {
  if (!S.dialog) render();
}

function absorbState(data) {
  S.state = data.activity;
  S.flows = list(data.flows);
  S.pending = data.pending;
  S.qa = data.qa || { turns: [], pending: false, waiting: [] };
  const ids = new Set(S.flows.map(f => f.id));
  const fresh = S.seenFlows && S.flows.find(f => !S.seenFlows.has(f.id));
  S.seenFlows = ids;
  if (fresh && S.mode === "flow" && !recentlyTouched()) selectFlow(fresh.id);
  if (!S.flowId || !ids.has(S.flowId)) selectFlow(S.flows[0]?.id || null);
  Object.keys(S.flowCache).forEach(id => { if (!ids.has(id)) delete S.flowCache[id]; });
  if (!S.mode) S.mode = S.flows.length ? "flow" : "live";
}

async function loadFlow() {
  if (!S.flowId || S.flowCache[S.flowId]) return;
  const id = S.flowId;
  const r = await api("GET", `/api/${KEY}/flow/${id}`);
  if (r.ok) S.flowCache[id] = r.data;
  else if (r.status) S.flowCache[id] = { status: REC.ERROR, error: r.error };
}

function tickTimers() {
  const now = Date.now() / 1000;
  document.querySelectorAll("[data-since]").forEach(el => {
    const since = Number(el.dataset.since);
    el.textContent = since > 0 ? secs(Math.max(0, now - since)) : "";
  });
}

const UNSTABLE_DATA = new Set(["tip"]);

function selectorOf(el) {
  const entries = Object.entries(el?.dataset || {}).filter(([k]) => !UNSTABLE_DATA.has(k));
  if (!entries.length) return null;
  return entries.map(([k, v]) => `[data-${k.replace(/[A-Z]/g, c => "-" + c.toLowerCase())}="${CSS.escape(v)}"]`).join("");
}

function render() {
  const app = document.getElementById("app");
  const focus = selectorOf(document.activeElement);
  const y = window.scrollY;
  const scrolls = [".dialog", ".tabs"].map(sel => [sel, app.querySelector(sel)?.scrollTop || 0, app.querySelector(sel)?.scrollLeft || 0]);
  app.innerHTML = `<div id="main" ${S.dialog ? "inert" : ""}>${KEY ? renderPanel() : renderIndex()}</div>${renderDialog()}`;
  window.scrollTo(0, y);
  scrolls.forEach(([sel, top, left]) => { const el = app.querySelector(sel); if (el) { el.scrollTop = top; el.scrollLeft = left; } });
  revealSelectedTab(app);
  const again = focus && app.querySelector(focus);
  if (again) again.focus();
  tickTimers();
}

function revealSelectedTab(app) {
  const strip = app.querySelector(".tabs");
  const tab = strip?.querySelector(".tab.on");
  if (!tab || S.flowId === S.scrolledFlowId) return;
  S.scrolledFlowId = S.flowId;
  const left = tab.offsetLeft - strip.offsetLeft;
  if (left < strip.scrollLeft || left + tab.offsetWidth > strip.scrollLeft + strip.clientWidth) {
    strip.scrollLeft = left - (strip.clientWidth - tab.offsetWidth) / 2;
  }
}

function renderIndex() {
  if (S.error) return `<div class="big-empty"><b>${t("disconnected")}</b>${esc(S.error)}</div>`;
  const panes = S.panes || [];
  return `<h2>${t("title_index")}</h2><div class="keys">${panes.map(p => `<a href="/p/${esc(p.key)}?t=${encodeURIComponent(TOKEN)}"><div class="card">
    <div class="space-between"><b>${esc((p.cwd || "").split("/").pop() || p.key.slice(0, 8))}</b>
    ${p.busy ? `<span class="pill busy"><i class="dot"></i>${t("busy")}</span>` : `<span class="pill">${t("idle")}</span>`}</div>
    <div class="mono path">${esc(p.cwd || p.key)}</div>
    <div class="counts">${t("idx_counts", p.tools, p.files)}${p.pending ? t("idx_gen") : ""}</div>
    ${p.flow ? `<div>${t("idx_recent")}${esc(p.flow)}</div>` : ""}
  </div></a>`).join("") || `<div class="big-empty"><b>${t("idx_empty_t")}</b>${t("idx_empty_d")}</div>`}</div>`;
}

function openCount() {
  return S.qa.turns.reduce((n, turn) => n + list(turn.items).filter(i => i.status !== QA.ANSWERED && !i.archived).length, 0);
}

function renderPanel() {
  if (!S.state) return S.error ? `<div class="big-empty"><b>${t("disconnected")}</b>${esc(S.error)}</div>` : `<div class="big-empty">${t("loading")}</div>`;
  const mode = S.mode || (S.flows.length ? "flow" : "live");
  const open = openCount();
  const modeButton = (m, label) => `<button class="mode ${mode === m ? "on" : ""}" data-mode="${m}" aria-pressed="${mode === m}">${label}</button>`;
  const header = `<div class="top header">
    <div class="modes">${modeButton("flow", t("mode_flow"))}${modeButton("live", t("mode_live"))}${modeButton("qa", `${t("mode_qa")}${open ? `<span class="n">${open}</span>` : ""}`)}</div>
    ${S.error ? `<span class="pill err" title="${esc(S.error)}"><i class="dot"></i>${t("disconnected")}</span>`
      : S.state.busy ? `<span class="pill busy"><i class="dot"></i>${t("busy")}</span>` : `<span class="pill"><i class="dot"></i>${t("idle")}</span>`}
    ${mode === "flow" && S.pending ? `<span class="pill gen"><i class="dot"></i>${t("flow_gen")} <span data-since="${Number(S.pending.since) || 0}"></span></span>` : ""}
    <span class="where" title="${esc(S.state.cwd || "")}">${esc((S.state.cwd || "").split("/").pop())}</span>
    ${mode === "flow" ? `<button class="btn" data-act="regen" title="${t("regen_title")}">${t("regen")}</button>` : ""}
    ${FULL ? "" : `<button class="btn" data-act="full" title="${t("full_title")}">${t("full")}</button>`}
    <button class="btn" data-act="help" title="${t("k_help")}">${t("help")}</button>
    <button class="btn" data-act="settings">${t("settings")}</button>
  </div>`;
  return header + (mode === "flow" ? renderFlow() : mode === "qa" ? renderQA() : renderLive());
}

function renderFlow() {
  if (!S.flows.length) {
    return `<div class="big-empty"><b>${t("flow_empty_t")}</b>${t("flow_empty_d")}${S.pending ? `<br>${t("flow_empty_now")}` : ""}</div>`;
  }
  const tabs = flowTabs();
  const rec = S.flowCache[S.flowId];
  if (!rec) return `<div class="top">${tabs}</div><div class="big-empty">${t("loading")}</div>`;
  if (rec.status !== REC.OK || !rec.flow) {
    return `<div class="top">${tabs}</div>
      <div class="card"><h3>${t("flow_fail")}</h3><div class="err-box">${esc(rec.error || text("unknown_err"))}</div></div>`;
  }
  const flow = rec.flow;
  const steps = list(flow.steps);
  if (!steps.length) return `<div class="top">${tabs}</div><div class="big-empty">${t("flow_empty_t")}</div>`;
  S.step = Math.min(Math.max(0, S.step), steps.length - 1);
  const i = S.step;
  return `<div class="top">${tabs}${flowControls(i, steps.length)}</div>
    <div class="progress"><i style="width:${((i + 1) / steps.length) * 100}%"></i></div>
    <div class="grid">${pipelineCard(flow, steps, i)}${stepDetail(rec, flow, steps[i], i)}${flowSide(rec, flow, steps, i)}</div>`;
}

function flowTabs() {
  return `<div class="tabs">${S.flows.map(f => `<button class="tab ${f.id === S.flowId ? "on" : ""} ${f.status === REC.ERROR ? "err" : ""}"
    data-flow="${esc(f.id)}" title="${esc(f.title)} ${clock(f.ts)}">${esc(f.title || f.id)}<small>${hhmm(f.ts)}</small></button>`).join("")}</div>`;
}

function flowControls(i, total) {
  return `<div class="ctrl"><button class="btn" data-act="prev" aria-label="${t("prev_step")}">←</button><span class="count">${i + 1} / ${total}</span>
    <button class="btn" data-act="next" aria-label="${t("next_step")}">→</button>
    <button class="btn primary" data-act="play">${S.playing ? t("pause") : t("play")}</button></div>`;
}

function pipelineCard(flow, steps, i) {
  const kindsUsed = [...new Set(steps.map(s => (KINDS[s.kind] ? s.kind : "logic")))];
  return `<div class="card"><h3>${t("pipeline")}</h3>
    ${flow.example ? `<div class="example"><b>${t("example_label")}</b>${inline(flow.example)}</div>` : ""}
    <div class="legend">${kindsUsed.map(k => `<span style="--c:${kindColor(k)}">${kindLabel(k)}</span>`).join("")}<span style="--c:var(--hl-line)">${t("changed_this")}</span></div>
    <ol class="steps">${steps.map((s, n) => `<li><button class="step ${n === i ? "on" : ""} ${s.changed ? "changed" : ""}" data-step="${n}" style="--c:${kindColor(s.kind)}" aria-current="${n === i}">
      <span class="num">${n + 1}</span><span><span class="t">${esc(s.title)}${s.changed ? `<span class="chg">${t("changed_short")}</span>` : ""}</span><span class="l">${esc(s.location)}</span></span></button></li>`).join("")}</ol>
    <div class="note">${inline(flow.summary)}</div></div>`;
}

function codeBlock(step) {
  if (!step.code) return "";
  const needles = list(step.highlight).map(h => String(h).trim()).filter(h => h.length >= MIN_HIGHLIGHT);
  return `<div class="label">${t("code")}</div><pre class="code">${String(step.code).replace(/\n$/, "").split("\n")
    .map(line => `<span class="${needles.some(h => line.includes(h)) ? "hl" : ""}">${esc(line) || " "}</span>`).join("")}</pre>`;
}

function stepDetail(rec, flow, step, i) {
  return `<div class="card detail">
    <div class="ctx">${esc(flow.title)}  ${clock(rec.ts)}</div>
    <div class="h"><h2>${circled(i + 1)} ${esc(step.title)}</h2><span class="badge" style="--c:${kindColor(step.kind)}">${kindLabel(step.kind)}</span>
    ${step.changed ? `<span class="badge" style="--c:var(--hl-line)">${t("changed_this")}</span>` : ""}</div>
    <code class="loc">${esc(step.location)}</code>${prose(step.explanation)}${codeBlock(step)}</div>`;
}

function flowSide(rec, flow, steps, i) {
  const changes = list(flow.changes);
  const checks = list(flow.checks);
  const cost = Number(rec.cost);
  const checkStatus = c => CHECK_ICON[c.status] ? c.status : CHECK.UNKNOWN;
  return `<div class="side">
    ${stateCard(steps, i)}
    <div class="card"><h3>${t("changes", changes.length)}</h3><div class="rows">${changes.map(c => `<div class="row"><span class="k M">M</span>
      <div class="v"><div class="path">${esc(c.file)}</div>${inline(c.what)}</div></div>`).join("") || `<div class="empty">${t("none")}</div>`}</div></div>
    ${checks.length ? `<div class="card"><h3>${t("checks")}</h3><div class="rows">${checks.map(c => `<div class="row">
      <span class="k st-${checkStatus(c)}">${CHECK_ICON[checkStatus(c)]}</span><span>${esc(c.label)}</span></div>`).join("")}</div></div>` : ""}
    <div class="card"><h3>${t("request")}</h3><div class="request">${esc(rec.prompt)}</div><div class="meta">${esc(rec.model || "")}${cost ? ` / $${cost.toFixed(3)}` : ""}</div></div>
    ${toolsCard(TOOLS_IN_FLOW)}</div>`;
}

function stateAt(steps, current) {
  const state = new Map();
  steps.slice(0, current + 1).forEach((s, n) => list(s.data).forEach(d => {
    if (d && d.name) state.set(String(d.name), { after: d.after, before: d.before, step: n });
  }));
  return state;
}

function stateCard(steps, current) {
  if (!steps.some(s => list(s.data).length)) return "";
  const rows = [...stateAt(steps, current)].map(([name, v]) => {
    const now = v.step === current && (v.before == null || v.before !== v.after);
    const before = now && v.before && v.before !== v.after ? `<span class="before">${esc(v.before)}</span>` : "";
    return `<tr class="${now ? "now" : ""}"><td>${esc(name)}${now ? "" : `<span class="step-no">${circled(v.step + 1)}</span>`}</td><td>${before}${esc(v.after)}</td></tr>`;
  }).join("");
  return `<div class="card state"><h3>${t("state_title")}</h3><table>${rows || `<tr><td colspan="2" class="empty">${t("state_empty")}</td></tr>`}</table></div>`;
}

function isTurnShown(turn, items) {
  if (turn.status !== REC.OK) return true;
  return items.length > 0 || !(S.qaOnlyOpen || list(turn.items).length);
}

function qaBar() {
  return `<div class="top qa-bar">
    <label class="btn"><input type="checkbox" data-act="qa-open" ${S.qaOnlyOpen ? "checked" : ""}>${t("qa_open_only")}</label>
    <label class="btn"><input type="checkbox" data-act="qa-archived" ${S.qaArchived ? "checked" : ""}>${t("qa_archived")}</label>
    ${S.qa.pending ? `<span class="pill gen"><i class="dot"></i>${t("qa_checking")}</span>` : ""}<span class="spacer"></span>
    ${S.qaPageTurns.length ? `<button class="btn" data-act="qa-regen" title="${t("qa_regen_title")}">${t("qa_regen")}</button>` : ""}</div>`;
}

function findItem(id) {
  for (const turn of S.qa.turns) {
    const item = list(turn.items).find(i => i.id === id);
    if (item) return item;
  }
  return null;
}


function waitingCard() {
  const waiting = list(S.qa.waiting);
  const eta = S.qa.eta;
  if (!waiting.length) return `<div class="qa-eta">${t("qa_eta", eta)}</div>`;
  const note = S.qa.pending ? t("qa_wait_checking") : S.qa.auto === false ? t("qa_wait_off") : t("qa_wait_d", eta);
  return `<div class="card qa-wait" role="status"><b>⏳ ${t("qa_wait_t", waiting.length)}</b><p class="qa-note">${note}</p>
    <ul>${waiting.map(w => `<li>${esc(w.text)}${w.mid_turn ? `<small>${t("midturn")}</small>` : ""}</li>`).join("")}</ul></div>`;
}

function renderQA() {
  if (!S.qa.turns.length) {
    S.qaPageTurns = [];
    return qaBar() + waitingCard() + (list(S.qa.waiting).length ? "" : `<div class="big-empty"><b>${t("qa_empty_t")}</b>${t("qa_empty_d")}</div>`);
  }
  const visible = S.qa.turns
    .map(turn => ({ turn, items: list(turn.items).filter(i => (!S.qaOnlyOpen || i.status !== QA.ANSWERED) && (S.qaArchived || !i.archived)) }))
    .filter(({ turn, items }) => isTurnShown(turn, items));
  const pages = Math.max(1, Math.ceil(visible.length / QA_PAGE));
  const page = Math.min(Math.max(1, S.qaPage), pages);
  const nums = [...new Set([1, page - 2, page - 1, page, page + 1, page + 2, pages])].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  const pager = pages > 1 ? `<div class="pager"><button data-qa-page="${page - 1}" ${page === 1 ? "disabled" : ""} aria-label="${t("prev_page")}">‹</button>
    ${nums.map((n, k) => `${k && n - nums[k - 1] > 1 ? "<span>…</span>" : ""}<button data-qa-page="${n}" class="${n === page ? "on" : ""}" ${n === page ? 'aria-current="page"' : ""}>${n}</button>`).join("")}
    <button data-qa-page="${page + 1}" ${page === pages ? "disabled" : ""} aria-label="${t("next_page")}">›</button><span>${t("turns_n", visible.length)}</span></div>` : "";
  const shown = visible.slice((page - 1) * QA_PAGE, page * QA_PAGE);
  S.qaPageTurns = shown.map(({ turn }) => turn.turn_id).filter(Boolean);
  const body = shown.map(({ turn, items }) => renderTurn(turn, items)).join("");
  const allArchived = !body && S.qa.turns.some(turn => list(turn.items).some(i => i.archived));
  return qaBar() + waitingCard() + pager + (body || `<div class="big-empty"><b>${allArchived ? t("qa_nothing_shown") : t("qa_all_done")}</b></div>`) + pager;
}

function renderTurn(turn, items) {
  const rows = items.map(item => {
    const id = esc(item.id);
    const status = STATUS_LABEL[item.status] ? item.status : QA.UNANSWERED;
    const busy = S.busyIds.has(item.id) ? 'aria-disabled="true"' : "";
    const answer = sentences(item.answer).map(line => `<p>${inline(line)}</p>`).join("");
    return `<div class="qa-item ${item.archived ? "archived" : ""}">
      <button class="chip ${status}" data-qa-cycle="${id}" ${busy}
        title="${t("cycle_title")}${item.manual ? t("auto_verdict", statusLabel(item.auto_status)) : ""}">${esc(statusLabel(status))}</button>
      <div><div class="q">${esc(item.question)}${item.from === FROM_MID_TURN ? `<small>${t("midturn")}</small>` : ""}<span class="qid" title="claude-qa set ${id} answered">${id}</span></div>
      <div class="a">${answer}</div>
      ${item.resolved_in && item.first_status ? `<div class="resolved">${t("resolved", statusLabel(item.first_status), statusLabel(item.auto_status))} ${clock(item.resolved_at)}</div>`
        : item.rechecked_at && item.first_status && item.first_status !== item.auto_status
          ? `<div class="resolved">${t("rechecked", statusLabel(item.first_status), statusLabel(item.auto_status))} ${clock(item.rechecked_at)}</div>` : ""}
      <div class="qa-tools">${status !== QA.ANSWERED && !item.archived && !item.manual ? `<button class="mini" data-qa-copy="${id}" ${busy} title="${t("copy_title")}">${t("copy_question")}</button>` : ""}
      ${item.manual ? "" : `<button class="mini" data-qa-recheck="${id}" title="${t("recheck_item_title")}">${t("recheck_item")}</button>`}
      <button class="mini" data-qa-archive="${id}" ${busy}>${item.archived ? t("restore") : t("archive")}</button>
      ${item.manual ? `<button class="mini" data-qa-reset="${id}" ${busy}>${t("reset_auto")}</button>` : ""}</div></div></div>`;
  }).join("");
  return `<div class="card qa-turn"><div class="qa-head"><span>${clock(turn.ts)}</span><span class="p" title="${esc(turn.prompt)}">${esc(turn.prompt)}</span>
    <span>${esc(turn.model || "")}${turn.scope === SCOPE_THROUGH_END ? t("through_end") : ""}</span>
    ${turn.status !== REC.OK ? `<button class="mini" data-qa-turn="${esc(turn.turn_id)}" title="${t("recheck_title")}">${t("recheck")}</button>` : ""}</div>
    ${turn.status !== REC.OK ? `<div class="err-box">${esc(turn.error || text("qa_fail"))}</div>` : ""}
    <div class="qa">${rows || (turn.status === REC.OK ? `<div class="empty">${t("qa_noq")}</div>` : "")}</div></div>`;
}

function toolsCard(limit) {
  const tools = list(S.state.tools).slice(-limit).reverse();
  return `<div class="card"><h3>${t("tools", list(S.state.tools).length)}</h3>${tools.map(tool => {
    const icon = TOOL_ICON[tool.state] || "-";
    const dur = tool.state === TOOL.RUN ? `<span data-since="${Number(tool.start) || 0}"></span>` : tool.end && tool.start ? secs(tool.end - tool.start) : "";
    const cls = EDIT_TOOLS.has(tool.tool) ? "edit" : (tool.tool || "").startsWith("mcp__") ? "mcp" : "other";
    return `<div class="tool"><span class="st-${esc(tool.state)}">${icon}</span><span class="time">${clock(tool.start)}</span>
      <span class="name ${cls}" title="${esc(tool.tool)}">${esc(tool.label)}</span><span class="sum" title="${esc(tool.file || tool.summary)}">${esc(tool.file || tool.summary)}</span><span class="dur">${dur}</span></div>`;
  }).join("") || `<div class="empty">${t("not_yet")}</div>`}</div>`;
}

function renderLive() {
  const files = list(S.state.files);
  const filesCard = `<div class="card"><h3>${t("files", files.length)}</h3><div class="rows">${files.map(f => `<div class="row">
    <span class="k ${f.created ? "A" : "M"}">${f.created ? "A" : "M"}</span><span class="path">${esc(f.path)}</span><span class="v">${Number(f.count) > 1 ? "×" + Number(f.count) : ""}</span></div>`).join("")
    || `<div class="empty">${t("none")}</div>`}</div></div>`;
  return `<div class="live-grid">${toolsCard(TOOLS_IN_LIVE)}<div>${filesCard}</div></div>`;
}

function renderDialog() {
  if (S.dialog === "help") return dialogShell("help", t("help_title"), renderHelpBody());
  if (S.dialog === "settings" && S.config) return dialogShell("settings", t("settings"), renderSettingsBody());
  return "";
}

function dialogShell(name, title, body) {
  return `<div class="overlay" data-overlay="${name}"><div class="card dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-${name}">
    <div class="dialog-head"><h3 id="dlg-${name}">${title}</h3><button class="btn" data-act="close">${t("close")}</button></div>${body}</div></div>`;
}

function renderHelpBody() {
  const row = (k, v) => `<tr><td class="cmd">${k}</td><td>${v}</td></tr>`;
  const c = S.config?.effective || {};
  return `<h4>${t("help_cmds")}</h4><table>
      ${row("claude-panel", t("h_panel"))}${row("claude-flow [all]", t("h_flow"))}${row("claude-qa list [--open]", t("h_qa_list"))}
      ${row("claude-qa set &lt;id&gt; answered|partial|unanswered|auto", t("h_qa_set"))}${row("claude-qa archive|restore &lt;id&gt;", t("h_qa_arch"))}</table>
    <h4>${t("help_keys")}</h4><table>
      ${row("<kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>", t("k_tabs"))}${row("<kbd>←</kbd> <kbd>→</kbd>", t("k_steps"))}${row("<kbd>?</kbd>", t("k_help"))}${row("<kbd>Esc</kbd>", t("k_escape"))}</table>
    <h4>${t("help_settings")}</h4><table>
      ${row(`model = ${esc(c.model)}`, t("s_model"))}${row(`lang = ${esc(c.lang)}`, t("s_lang"))}
      ${row(`flow_auto = ${c.flow_auto ? 1 : 0}`, t("s_flow_auto"))}${row(`qa_auto = ${c.qa_auto ? 1 : 0}`, t("s_qa_auto"))}${row(`panel_auto = ${c.panel_auto ? 1 : 0}`, t("s_panel_auto"))}</table>`;
}

function renderSettingsBody() {
  const c = S.config;
  const paneScope = S.scope === SCOPE.PANE && KEY;
  const values = paneScope ? c.effective : c.global;
  const scoped = name => KEY && name in (c.pane || {})
    ? `<span class="scoped">${t("pane_override")}</span>${paneScope ? ` <button class="mini" data-reset-setting="${name}">${t("follow_global")}</button>` : ""}` : "";
  const toggle = (name, label) => `<label><input type="checkbox" data-setting="${name}" aria-label="${label}" ${values[name] ? "checked" : ""}> ${values[name] ? t("on") : t("off")}</label>`;
  const select = (name, label, options) => `<select class="btn" data-setting="${name}" aria-label="${label}">${options.map(o =>
    `<option value="${esc(o.value)}" ${o.value === values[name] ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
  const models = [...new Set([...c.models, values.model])].map(m => ({ value: m, label: m }));
  const langs = c.langs.map(l => ({ value: l.code, label: l.label }));
  const row = (name, label, control) => `<tr><td>${label}${scoped(name)}</td><td>${control}</td></tr>`;
  const scopeSwitch = KEY ? `<p>${t("scope_label")}: <select class="btn" data-scope aria-label="${t("scope_label")}">
    <option value="${SCOPE.GLOBAL}" ${!paneScope ? "selected" : ""}>${t("scope_global")}</option>
    <option value="${SCOPE.PANE}" ${paneScope ? "selected" : ""}>${t("scope_pane")}</option></select></p>` : "";
  return `<p>${t("settings_note")}</p>${scopeSwitch}<table>
    ${row("model", t("s_model"), select("model", t("s_model"), models))}
    ${row("lang", t("s_lang"), select("lang", t("s_lang"), langs))}
    ${row("flow_auto", t("s_flow_auto"), toggle("flow_auto", t("s_flow_auto")))}
    ${row("qa_auto", t("s_qa_auto"), toggle("qa_auto", t("s_qa_auto")))}
    ${row("panel_auto", t("s_panel_auto"), toggle("panel_auto", t("s_panel_auto")))}</table>
    ${S.settingsMsg ? `<p class="${S.settingsMsg.ok ? "msg-ok" : "msg-err"}">${esc(S.settingsMsg.text)}</p>` : ""}`;
}

async function openDialog(name) {
  stopAutoplay();
  if (!S.dialog) S.returnFocus = selectorOf(document.activeElement);
  S.settingsMsg = null;
  const r = await api("GET", `/api/config${KEY ? `?pane=${KEY}` : ""}`);
  if (!r.ok) return notify(r.error, true);
  S.config = r.data;
  S.dialog = name;
  render();
  document.querySelector("[data-act=close]")?.focus();
}

function closeDialog() {
  S.dialog = null;
  render();
  if (S.returnFocus) document.querySelector(S.returnFocus)?.focus();
  S.returnFocus = null;
}

async function saveSetting(update) {
  const pane = S.scope === SCOPE.PANE && KEY ? `?pane=${KEY}` : "";
  const before = S.config?.effective?.lang;
  const r = await api("POST", `/api/config${pane}`, update);
  if (!r.ok) {
    S.settingsMsg = { ok: false, text: r.error };
    return render();
  }
  const fresh = await api("GET", `/api/config${KEY ? `?pane=${KEY}` : ""}`);
  if (fresh.ok) S.config = fresh.data;
  if (S.config.effective.lang !== before) {
    const url = new URL(location.href);
    url.searchParams.delete("lang");
    url.searchParams.set("dialog", DIALOG.SETTINGS);
    url.searchParams.set("scope", S.scope);
    return location.replace(url);
  }
  S.settingsMsg = { ok: true, text: text("saved") };
  render();
  poll(true);
}

function notify(message, error) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.toggle("err", Boolean(error));
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => { el.textContent = ""; }, TOAST_MS);
}

function selectFlow(id) {
  if (id === S.flowId) return;
  stopAutoplay();
  S.step = S.flowId === null ? S.step : 0;
  S.flowId = id;
}

function setMode(mode) {
  if (!MODES.includes(mode)) return;
  if (mode !== "flow") stopAutoplay();
  S.mode = mode;
  render();
}

function stopAutoplay() {
  if (S.playing) clearInterval(S.playing);
  S.playing = null;
}

function stepCount() {
  return list(S.flowCache[S.flowId]?.flow?.steps).length;
}

function go(n) {
  const len = stepCount();
  if (!len || S.mode !== "flow" || S.dialog) return;
  S.step = (n + len) % len;
  render();
}

async function withBusy(item, work) {
  if (S.busyIds.has(item.id)) return;
  S.busyIds.add(item.id);
  render();
  try {
    await work();
  } finally {
    S.busyIds.delete(item.id);
    render();
  }
}

function postOverride(item, body) {
  return withBusy(item, async () => {
    const r = await api("POST", `/api/${KEY}/qa/override`, { id: item.id, ...body });
    if (!r.ok) notify(r.error, true);
    await poll(true);
  });
}

function copyQuestion(item) {
  return withBusy(item, async () => {
    const r = await api("POST", `/api/${KEY}/qa/copy`, { id: item.id });
    if (!r.ok) return notify(r.error, true);
    notify(text(r.data.copied ? "copy_done" : "copy_failed"), !r.data.copied);
  });
}

function togglePlay() {
  if (S.playing) {
    stopAutoplay();
  } else {
    if (S.step >= stepCount() - 1) S.step = 0;
    S.playing = setInterval(() => (S.step >= stepCount() - 1 ? (stopAutoplay(), render()) : go(S.step + 1)), AUTOPLAY_MS);
  }
  render();
}

async function openFull() {
  const r = await api("POST", `/api/${KEY}/open?mode=${S.mode || ""}`);
  if (!r.ok) notify(r.error, true);
}

async function resetSetting(name) {
  await saveSetting({ [name]: null });
  document.querySelector(`[data-setting="${CSS.escape(name)}"]`)?.focus();
}

function setQaFilter(key, checked) {
  S[key] = checked;
  S.qaPage = 1;
  render();
}

async function regen(target, turn, item, scope, turns) {
  touch();
  const query = `target=${target}${turn ? `&turn=${encodeURIComponent(turn)}` : ""}${item ? `&item=${encodeURIComponent(item)}` : ""}`
    + `${scope ? `&scope=${scope}` : ""}${turns && turns.length ? `&turns=${turns.map(encodeURIComponent).join(",")}` : ""}`;
  const r = await api("POST", `/api/${KEY}/regen?${query}`);
  if (!r.ok) return notify(r.error, true);
  notify(text(target === "qa" ? "qa_checking" : "flow_started"));
  await poll(true);
}

const ACTIONS = {
  close: () => closeDialog(),
  [DIALOG.HELP]: () => S.dialog === DIALOG.HELP ? closeDialog() : openDialog(DIALOG.HELP),
  [DIALOG.SETTINGS]: () => S.dialog === DIALOG.SETTINGS ? closeDialog() : openDialog(DIALOG.SETTINGS),
  "qa-open": el => setQaFilter("qaOnlyOpen", el.checked),
  "qa-archived": el => setQaFilter("qaArchived", el.checked),
  prev: () => go(S.step - 1),
  next: () => go(S.step + 1),
  play: togglePlay,
  full: openFull,
  regen: () => regen("flow", null),
  "qa-regen": () => regen("qa", null, null, "open", S.qaPageTurns),
};

const ITEM_ACTIONS = {
  qaCycle: item => postOverride(item, { status: QA_CYCLE[item.status] || QA.ANSWERED }),
  qaArchive: item => postOverride(item, { archived: !item.archived }),
  qaReset: item => postOverride(item, { status: null }),
  qaRecheck: item => regen("qa", null, item.id),
  qaCopy: copyQuestion,
};

const DATA_ACTIONS = {
  resetSetting: resetSetting,
  qaPage: page => { S.qaPage = Number(page); render(); window.scrollTo(0, 0); },
  qaTurn: turn => regen("qa", turn),
  mode: mode => setMode(mode),
  flow: async id => { selectFlow(id); S.mode = "flow"; await loadFlow(); render(); },
  step: n => go(Number(n)),
};

document.addEventListener("click", e => {
  const overlay = e.target.closest("[data-overlay]");
  if (overlay && e.target === overlay) return closeDialog();
  const el = e.target.closest("button, [data-act=qa-open], [data-act=qa-archived]");
  if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
  const d = el.dataset;
  touch();
  if (ACTIONS[d.act]) return ACTIONS[d.act](el);
  const itemAction = Object.keys(ITEM_ACTIONS).find(k => d[k] !== undefined);
  if (itemAction) {
    const item = findItem(d[itemAction]);
    return item && ITEM_ACTIONS[itemAction](item);
  }
  const dataAction = Object.keys(DATA_ACTIONS).find(k => d[k] !== undefined);
  if (dataAction) return DATA_ACTIONS[dataAction](d[dataAction]);
});

document.addEventListener("change", e => {
  const target = e.target;
  if (target.dataset.scope !== undefined) { S.scope = target.value; S.settingsMsg = null; return render(); }
  const name = target.dataset.setting;
  if (name) saveSetting({ [name]: target.type === "checkbox" ? target.checked : target.value });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.dialog) return closeDialog();
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, select, textarea")) return;
  if (e.key === "?") { e.preventDefault(); return S.dialog === DIALOG.HELP ? closeDialog() : openDialog(DIALOG.HELP); }
  if (S.dialog || !KEY) return;
  if (KEY_MODES[e.key]) { touch(); return setMode(KEY_MODES[e.key]); }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { touch(); go(S.step + (e.key === "ArrowRight" ? 1 : -1)); }
});

const TIP_GAP = 8;
const tip = document.getElementById("tip");
let tipAnchor = null;

function hideTip() {
  tipAnchor = null;
  tip.textContent = "";
}

function showTip(el) {
  const text = el.dataset.tip;
  const clipped = getComputedStyle(el).textOverflow === "ellipsis";
  if (!text || (clipped && el.scrollWidth <= el.clientWidth)) return hideTip();
  tipAnchor = el;
  tip.textContent = text;
  const box = el.getBoundingClientRect();
  const width = tip.offsetWidth, height = tip.offsetHeight;
  const below = box.bottom + TIP_GAP + height <= innerHeight;
  tip.style.left = `${Math.max(TIP_GAP, Math.min(box.left, innerWidth - width - TIP_GAP))}px`;
  tip.style.top = `${below ? box.bottom + TIP_GAP : Math.max(TIP_GAP, box.top - height - TIP_GAP)}px`;
}

document.addEventListener("pointerover", e => {
  const el = e.target.closest?.("[title], [data-tip]");
  if (!el) return hideTip();
  if (el.hasAttribute("title")) {
    el.dataset.tip = el.getAttribute("title");
    el.removeAttribute("title");
  }
  if (el !== tipAnchor) showTip(el);
});
document.addEventListener("pointerleave", hideTip);
addEventListener("scroll", hideTip, true);

(async () => {
  if (S.dialog) await openDialog(S.dialog);
  await poll(true);
  setInterval(() => {
    poll();
    if (tipAnchor && !tipAnchor.isConnected) hideTip();
  }, POLL_MS);
})();
</script>
</body>
</html>
