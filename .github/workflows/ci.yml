name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Browser page tests
        run: node --test tests/browser/page.test.mjs
      - name: Hook, server and diff end to end
        run: bash tests/e2e/hooks.sh
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.299
      - name: Mod tests
        run: claude plugin test . && claude plugin validate .
